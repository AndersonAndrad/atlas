# ATLAS CI (PLAN-024): every check on Linux and macOS; installers for Linux, macOS and
# Windows (PLAN-034) are built only when all of them pass. Download the installers from
# the run's artifacts, or from the GitHub Release created for a `v*` tag.
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: 24.18.0

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb zsh
          # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Unit and integration tests
        run: pnpm test
      - name: End-to-end tests
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}pnpm test:e2e
      - name: Keep end-to-end traces of failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      matrix:
        include:
          - name: debian-x64
            os: ubuntu-24.04
            files: apps/desktop/dist/*.deb
          - name: macos-arm64
            os: macos-15
            files: |
              apps/desktop/dist/*.dmg
              apps/desktop/dist/*.zip
          # Built only: the checks above do not run on Windows yet (PLAN-034).
          - name: windows-x64
            os: windows-2025
            files: apps/desktop/dist/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build installers
        run: pnpm package
        env:
          # Not signed with a developer certificate yet (ad-hoc on macOS).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check the Debian package
        if: runner.os == 'Linux'
        run: |
          deb=$(ls apps/desktop/dist/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -q 'opt/A.T.L.A.S/atlas-control'
      - name: Check the Windows package
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ls apps/desktop/dist/*.exe
          find apps/desktop/dist/win-unpacked -path '*app.asar.unpacked*' -name conpty.node | grep -q .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-control-${{ matrix.name }}
          path: ${{ matrix.files }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: atlas-control-*
          merge-multiple: true
          path: installers
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "A.T.L.A.S $TAG" \
            --notes "Installers built after every check passed. macOS builds are not notarized yet: right-click the app and choose Open the first time. Windows builds are not signed yet and have not been tested on Windows: if SmartScreen warns, choose More info, then Run anyway."
